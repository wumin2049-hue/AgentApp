name: mincode · Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      variant:
        description: 'APK 类型'
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
  workflow_call:
    inputs:
      variant:
        required: false
        type: string
        default: debug
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}

concurrency:
  group: mincode-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      variant: ${{ steps.buildvar.outputs.variant }}
      artifact_name: ${{ steps.buildvar.outputs.artifact_name }}
      should_upload: ${{ steps.buildvar.outputs.should_upload }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.variant }}" ]; then
            VARIANT="${{ inputs.variant }}"
          elif [ -n "${{ github.event.inputs.variant }}" ]; then
            VARIANT="${{ github.event.inputs.variant }}"
          else
            VARIANT="debug"
          fi
          echo "requested_variant=$VARIANT" >> "$GITHUB_OUTPUT"

      - name: Resolve build variant
        id: buildvar
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          REQUESTED="${{ steps.meta.outputs.requested_variant }}"
          VERSION="${{ steps.meta.outputs.version }}"
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          if [ "$REQUESTED" = "release" ] && [ -z "$KEYSTORE" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，改打 Debug APK（可直接安装测试）"
            VARIANT="debug"
          else
            VARIANT="$REQUESTED"
          fi
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "artifact_name=mincode-${VERSION}-${VARIANT}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          # 避免每次 push/PR 都上传 Artifact 撑爆配额：
          # - release：需要给后续 Release job 用，始终上传
          # - debug：仅手动 workflow_dispatch 上传
          UPLOAD="false"
          if [ "$VARIANT" = "release" ]; then
            UPLOAD="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            UPLOAD="true"
          fi
          echo "should_upload=$UPLOAD" >> "$GITHUB_OUTPUT"
          echo "Artifact upload: $UPLOAD (event=${{ github.event_name }}, variant=$VARIANT)"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # v3 默认安装已下架的 tools 包会失败，v4 修复；显式安装 compileSdk 34
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - run: npm ci
      - run: npm run build
      - name: Ensure Android platform
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi
      # sync 可能重置 MainActivity；patch 必须在 sync 之后
      - run: npx cap sync android
      - run: npm run android:patch
      - run: npx cap sync android
      - run: npm run android:patch
      - run: npm run android:icons

      - name: Decode release keystore
        if: steps.buildvar.outputs.variant == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Inject signing config
        if: steps.buildvar.outputs.variant == 'release'
        run: node scripts/ci-inject-signing.mjs

      - name: Build Debug APK
        if: steps.buildvar.outputs.variant == 'debug'
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: steps.buildvar.outputs.variant == 'release'
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      # 上传前清空本仓库全部 Actions Artifact，腾出配额
      - name: Purge old Actions artifacts
        if: steps.buildvar.outputs.should_upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "Listing artifacts for ${{ github.repository }}…"
          PAGE=1
          while true; do
            RESP=$(gh api "/repos/${{ github.repository }}/actions/artifacts?per_page=100&page=$PAGE") || break
            IDS=$(echo "$RESP" | jq -r '.artifacts[]?.id // empty')
            COUNT=$(echo "$IDS" | grep -c '^[0-9]' || true)
            if [ "$COUNT" -eq 0 ]; then
              break
            fi
            for id in $IDS; do
              echo "Deleting artifact id=$id"
              gh api -X DELETE "/repos/${{ github.repository }}/actions/artifacts/$id" || true
            done
            TOTAL=$(echo "$RESP" | jq -r '.total_count // 0')
            DONE=$((PAGE * 100))
            if [ "$DONE" -ge "$TOTAL" ]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done
          echo "Purge done."

      - name: Upload Debug APK
        if: steps.buildvar.outputs.variant == 'debug' && steps.buildvar.outputs.should_upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.buildvar.outputs.artifact_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload Release APK
        if: steps.buildvar.outputs.variant == 'release' && steps.buildvar.outputs.should_upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.buildvar.outputs.artifact_name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Summary
        run: |
          echo "### mincode APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ steps.meta.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Variant: \`${{ steps.buildvar.outputs.variant }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upload artifact: \`${{ steps.buildvar.outputs.should_upload }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`${{ steps.buildvar.outputs.artifact_name }}\`" >> "$GITHUB_STEP_SUMMARY"
