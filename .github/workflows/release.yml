name: mincode · GitHub Release

# 注意：不走 Actions Artifact（避免 artifact 存储配额打满导致无法发版）
# 本 workflow 在同一 job 内编译并把 APK 直接挂到 GitHub Release。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（如 v1.0.20）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mincode-release-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Read app version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - run: npm ci
      - run: npm run build
      - name: Ensure Android platform
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi
      - run: npx cap sync android
      - run: npm run android:patch
      - run: npx cap sync android
      - run: npm run android:patch
      - run: npm run android:icons

      - name: Resolve build variant
        id: buildvar
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，改打 Debug APK"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.buildvar.outputs.variant == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Inject signing config
        if: steps.buildvar.outputs.variant == 'release'
        run: node scripts/ci-inject-signing.mjs

      - name: Build Debug APK
        if: steps.buildvar.outputs.variant == 'debug'
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: steps.buildvar.outputs.variant == 'release'
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        id: apk
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          VER="${TAG#v}"
          VARIANT="${{ steps.buildvar.outputs.variant }}"
          if [ "$VARIANT" = "release" ]; then
            SRC="android/app/build/outputs/apk/release/app-release.apk"
          else
            SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          if [ ! -f "$SRC" ]; then
            echo "::error::未找到 APK: $SRC"
            find android/app/build/outputs -type f -name '*.apk' || true
            exit 1
          fi
          OUT="mincode-${VER}-${VARIANT}.apk"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: mincode ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.file }}
          fail_on_unmatched_files: true

      - name: Summary
        run: |
          echo "### mincode Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ steps.tag.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ steps.meta.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Variant: \`${{ steps.buildvar.outputs.variant }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: \`${{ steps.apk.outputs.file }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 已直接挂到 GitHub Release（未使用 Actions Artifact）" >> "$GITHUB_STEP_SUMMARY"
