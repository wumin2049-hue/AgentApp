<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#e8f1fc" />
  <title>AI 设置</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div class="app-shell">
    <div class="preview-banner">静态 HTML 预览 · 浅蓝科技主题</div>

    <header class="app-header app-header-glow">
      <h1>AI 设置</h1>
      <div class="sub">Harness 接口配置 · 全局生效 · 所有项目共用</div>
    </header>

    <main class="app-main">
      <div class="card card-warn">
        <span class="card-title">会话存储目录（必填）</span>
        <p class="hint-text" style="margin:0 0 12px">会话以目录+文件保存，须先选择手机上的总目录。</p>
        <button class="btn btn-primary btn-block" type="button">选择会话存储总目录</button>
      </div>

      <div class="card card-premium">
        <span class="card-title">接口配置</span>
        <p class="hint-text" style="margin:0 0 14px">填写上游 API 地址与 Key，对齐 agent Harness。</p>
        <div class="field">
          <label>API 地址</label>
          <input type="url" value="https://api.deepseek.com" placeholder="https://api.deepseek.com" />
        </div>
        <div class="field">
          <label>API Key</label>
          <input type="password" placeholder="sk-…" autocomplete="off" />
        </div>
        <div class="btn-row" style="margin-top:12px">
          <button class="btn btn-primary" type="button">测试连接</button>
          <button class="btn btn-ghost" type="button">保存</button>
        </div>
        <p class="hint-text ok" style="margin-top:10px">连接正常，可以拉取模型并开始对话</p>
      </div>

      <div class="card card-premium">
        <span class="card-title">模型</span>
        <div class="field">
          <label>默认模型</label>
          <input type="text" value="deepseek-chat" />
        </div>
        <button class="btn btn-primary btn-block" type="button" style="margin-top:8px">拉取模型列表</button>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">
          <button type="button" class="chip active">deepseek-chat</button>
          <button type="button" class="chip">gpt-4o-mini</button>
        </div>
      </div>

      <div class="card">
        <span class="card-title">关于</span>
        <p class="hint-text" style="margin:0">mincode v1.0.12 · 工具本地执行 · 模型直连上游 API</p>
      </div>
    </main>

    <nav class="tab-bar">
      <a href="index.html"><span class="tab-icon">⌂</span><span>首页</span></a>
      <a href="chat.html"><span class="tab-icon">◉</span><span>对话</span></a>
      <a href="projects.html"><span class="tab-icon">▤</span><span>项目</span></a>
      <a href="ftp.html"><span class="tab-icon">⇪</span><span>FTP</span></a>
      <a href="settings.html" class="active"><span class="tab-icon">⚙</span><span>设置</span></a>
    </nav>
  </div>
</body>
</html>
