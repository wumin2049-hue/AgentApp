<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#e8f1fc" />
  <title>Agent 对话</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div class="app-shell">
    <div class="preview-banner">静态 HTML 预览 · 浅蓝科技主题</div>

    <header class="app-header chat-header">
      <div class="chat-header-row">
        <button
          type="button"
          class="chat-header-btn"
          id="historyOpen"
          title="会话记录"
          aria-label="打开会话记录"
        >
          <span aria-hidden="true">☰</span>
        </button>
        <div class="chat-header-titles">
          <h1>改首页标题</h1>
          <div class="sub">官网前端 · deepseek-chat · ai.1k0.com</div>
        </div>
        <button
          type="button"
          class="chat-header-btn"
          id="newSessionBtn"
          title="新会话"
          aria-label="开启新会话"
        >
          <span aria-hidden="true">＋</span>
        </button>
      </div>
    </header>

    <main class="app-main chat-main">
      <div class="msg-user msg-row">
        <div class="msg-body">把首页 hero 区域的标题改成「欢迎使用 ABS」</div>
      </div>

      <div class="tool-log-panel">
        <div class="tool-log-head">
          <span class="tool-log-title">读取与工具记录 · 2</span>
        </div>
        <div class="tool-log-scroll">
          <div class="tool-line ok">✓ 读取 index.html</div>
          <div class="tool-line ok">✓ 写入 index.html</div>
        </div>
        <button type="button" class="tool-log-detail">查看详情</button>
      </div>

      <div class="msg-assistant msg-row">
        <div class="msg-body">
          <span class="msg-text">已修改首页标题，建议刷新后确认样式。</span>
        </div>
      </div>

      <div class="turn-modified-bar">
        <button type="button" class="btn btn-ghost btn-block">
          查看 AI 实际修改的文件（1）
        </button>
      </div>
    </main>

    <div class="chat-input-dock">
      <div class="chat-input-wrap chat-input-wrap--compact">
        <div class="chat-input-bar">
          <textarea rows="2" placeholder="描述要改什么… 或 /img /video 提示词"></textarea>
          <button class="btn btn-primary" type="button">发送</button>
        </div>
      </div>
    </div>

    <button type="button" class="chat-fab" id="chatFab" title="项目与工作区" aria-label="打开项目设置">
      <span class="chat-fab-icon">▤</span>
    </button>

    <!-- 全高左侧会话记录侧栏 -->
    <div
      class="sheet-overlay history-drawer-overlay"
      id="historyDrawer"
      hidden
      aria-hidden="true"
    >
      <aside class="history-drawer" role="dialog" aria-modal="true" aria-label="会话记录">
        <div class="history-drawer-header">
          <div class="history-drawer-titles">
            <strong>会话记录</strong>
            <span class="history-drawer-sub">Documents/abs-chats</span>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" id="historyClose">关闭</button>
        </div>
        <div class="history-drawer-toolbar">
          <button type="button" class="btn btn-primary btn-block" id="historyNewSession">
            开启新会话
          </button>
        </div>
        <div class="history-drawer-body">
          <ul class="session-list session-list--drawer">
            <li class="session-item active">
              <button type="button" class="session-main">
                <span class="session-title">改首页标题</span>
                <span class="session-meta">10-26 14:08 · 4 条</span>
                <span class="session-preview">把首页 hero 区域的标题改成…</span>
              </button>
              <button type="button" class="session-del">删除</button>
            </li>
            <li class="session-item">
              <button type="button" class="session-main">
                <span class="session-title">会话 2</span>
                <span class="session-meta">10-25 21:12 · 2 条</span>
                <span class="session-preview">帮我检查 FTP 上传脚本</span>
              </button>
              <button type="button" class="session-del">删除</button>
            </li>
          </ul>
        </div>
      </aside>
    </div>

    <div class="sheet-overlay" id="projectSheet" hidden aria-hidden="true">
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="projectSheetTitle">
        <div class="sheet-header">
          <strong id="projectSheetTitle">项目与工作区</strong>
          <button type="button" class="btn btn-ghost btn-sm" id="projectSheetClose" aria-label="关闭项目设置">关闭</button>
        </div>
        <div class="sheet-body">
          <label class="field-label">当前项目</label>
          <select class="project-select">
            <option selected>官网前端</option>
            <option>小程序后端</option>
          </select>
          <p class="ftp-context-hint" style="margin-top:10px">
            📁 项目根：<strong>Documents/www</strong>
            <span class="scope-tag">沙盒 /</span>
          </p>
          <div class="field" style="margin-top:12px;margin-bottom:0">
            <label>AI 工作区（仅允许改此目录下文件）</label>
            <div class="work-root-row">
              <input type="text" value="src" placeholder="留空 = 整个项目根" />
              <button class="btn btn-ghost btn-sm" type="button">应用</button>
            </div>
          </div>
          <div class="subdir-chips">
            <button type="button" class="chip">项目根 /</button>
            <button type="button" class="chip active">src/</button>
            <button type="button" class="chip">api/</button>
          </div>
          <p class="scope-hint">当前工作区：src/</p>
          <div class="sheet-section">
            <label class="field-label">会话操作</label>
            <button class="btn btn-primary btn-block" type="button">开启新会话</button>
            <button
              class="btn btn-ghost btn-block"
              type="button"
              style="margin-top:8px"
              id="openHistoryFromSheet"
            >
              查看会话记录
            </button>
            <div class="chat-actions chat-actions--sheet">
              <button class="btn btn-ghost" type="button">写回手机</button>
              <button class="btn btn-ghost" type="button">FTP 上传</button>
              <button class="btn btn-ghost btn-compact" type="button">清空当前会话</button>
            </div>
            <p class="slash-hint slash-hint--sheet">
              斜杠命令：<code>/img</code> <code>/img-async</code> <code>/video</code> <code>/video-quote</code>
            </p>
          </div>
        </div>
      </div>
    </div>

    <nav class="tab-bar">
      <a href="index.html"><span class="tab-icon">⌂</span><span>首页</span></a>
      <a href="chat.html" class="active"><span class="tab-icon">◉</span><span>对话</span></a>
      <a href="projects.html"><span class="tab-icon">▤</span><span>项目</span></a>
      <a href="ftp.html"><span class="tab-icon">⇪</span><span>FTP</span></a>
      <a href="settings.html"><span class="tab-icon">⚙</span><span>设置</span></a>
    </nav>
  </div>
  <script>
    (function () {
      var sheet = document.getElementById('projectSheet');
      var fab = document.getElementById('chatFab');
      var closeBtn = document.getElementById('projectSheetClose');
      var history = document.getElementById('historyDrawer');
      var historyOpen = document.getElementById('historyOpen');
      var historyClose = document.getElementById('historyClose');
      var openFromSheet = document.getElementById('openHistoryFromSheet');
      var input = document.querySelector('.chat-input-bar textarea');
      if (!sheet || !fab || !closeBtn || !history) return;

      function focusInput() {
        if (!input) return;
        requestAnimationFrame(function () {
          input.focus({ preventScroll: true });
        });
      }

      function openSheet() {
        sheet.hidden = false;
        sheet.setAttribute('aria-hidden', 'false');
      }
      function closeSheet() {
        sheet.hidden = true;
        sheet.setAttribute('aria-hidden', 'true');
        focusInput();
      }
      function openHistory() {
        history.hidden = false;
        history.setAttribute('aria-hidden', 'false');
      }
      function closeHistory() {
        history.hidden = true;
        history.setAttribute('aria-hidden', 'true');
        focusInput();
      }

      fab.addEventListener('click', openSheet);
      closeBtn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        closeSheet();
      });
      sheet.addEventListener('click', function (e) {
        if (e.target === sheet) closeSheet();
      });
      if (historyOpen) historyOpen.addEventListener('click', openHistory);
      if (historyClose) historyClose.addEventListener('click', closeHistory);
      history.addEventListener('click', function (e) {
        if (e.target === history) closeHistory();
      });
      if (openFromSheet) {
        openFromSheet.addEventListener('click', function () {
          closeSheet();
          openHistory();
        });
      }
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        if (!history.hidden) closeHistory();
        else if (!sheet.hidden) closeSheet();
      });
    })();
  </script>
</body>
</html>
