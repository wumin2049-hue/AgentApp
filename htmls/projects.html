<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#e8f1fc" />
  <title>项目</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div class="app-shell">
    <div class="preview-banner">静态 HTML 预览 · 浅蓝科技主题</div>

    <header class="app-header">
      <h1>项目</h1>
      <div class="sub">每个项目绑定手机文件夹（需授权读/写/列表）+ FTP</div>
    </header>

    <main class="app-main">
      <div class="card">
        <div class="field">
          <label>项目名称（可选）</label>
          <input type="text" placeholder="例如：官网前端" />
        </div>
        <button class="btn btn-primary btn-block" type="button">＋ 新建并授权手机文件夹</button>
        <p class="hint-text" style="margin-top:10px">
          弹出系统目录选择器后，请点「使用此文件夹」，否则无法同步与改代码。
        </p>
      </div>

      <a href="project-edit.html" class="card card-clickable">
        <div class="project-item-header">
          <strong class="project-name">官网前端</strong>
          <span class="badge">当前</span>
        </div>
        <div class="card-meta">Documents/www</div>
      </a>

      <a href="project-edit.html" class="card card-clickable">
        <div class="project-item-header">
          <strong class="project-name">小程序后端</strong>
        </div>
        <div class="card-meta">Download/api</div>
      </a>
    </main>

    <nav class="tab-bar">
      <a href="index.html"><span class="tab-icon">⌂</span><span>首页</span></a>
      <a href="chat.html"><span class="tab-icon">◉</span><span>对话</span></a>
      <a href="projects.html" class="active"><span class="tab-icon">▤</span><span>项目</span></a>
      <a href="ftp.html"><span class="tab-icon">⇪</span><span>FTP</span></a>
      <a href="settings.html"><span class="tab-icon">⚙</span><span>设置</span></a>
    </nav>
  </div>
</body>
</html>
