<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#e8f1fc" />
  <title>mincode · 项目</title>
  <link rel="stylesheet" href="assets/app.css" />
  <link rel="icon" type="image/png" href="assets/icon.png" />
</head>
<body>
  <div class="app-shell">
    <div class="preview-banner">静态预览 · 项目列表</div>

    <header class="app-header">
      <h1>项目</h1>
      <div class="sub">每个项目绑定手机文件夹（需授权读/写/列表）+ FTP</div>
    </header>

    <main class="app-main">
      <div class="card card-premium">
        <span class="card-title">新建项目</span>
        <div class="field">
          <label>项目名称（可选）</label>
          <input type="text" placeholder="例如：官网前端" />
        </div>
        <button class="btn btn-primary btn-block" type="button">＋ 新建并授权手机文件夹</button>
        <p class="hint-text sp-t2">
          弹出系统目录选择器后，请点「使用此文件夹」，否则无法同步与改代码。
        </p>
      </div>

      <div class="section-head">
        <span class="section-head-title">已有项目 · 2</span>
      </div>

      <a href="project-edit.html" class="card card-clickable">
        <div class="project-item-header">
          <strong class="project-name">官网前端</strong>
          <span class="badge">当前</span>
        </div>
        <div class="card-meta">📁 Documents/www · 128 个文件 · 3 个待上传</div>
        <div class="sp-inline">
          <span class="chip active" style="font-size:11px">deepseek-chat</span>
          <span class="chip" style="font-size:11px">FTP 已配置</span>
        </div>
      </a>

      <a href="project-edit.html" class="card card-clickable">
        <div class="project-item-header">
          <strong class="project-name">小程序后端</strong>
        </div>
        <div class="card-meta">📁 Download/api · 42 个文件</div>
        <div class="sp-inline">
          <span class="chip" style="font-size:11px">deepseek-chat</span>
          <span class="chip" style="font-size:11px">FTP 未配置</span>
        </div>
      </a>

      <div class="empty-state sp-t3">
        <span class="empty-state-icon">▤</span>
        <span class="empty-state-title">继续添加项目</span>
        <span class="empty-state-desc">每个项目可绑定不同的手机目录与 FTP 站点，互不影响。</span>
      </div>
    </main>

    <nav class="tab-bar">
      <a href="index.html"><span class="tab-icon">⌂</span><span>首页</span></a>
      <a href="chat.html"><span class="tab-icon">◉</span><span>对话</span></a>
      <a href="projects.html" class="active"><span class="tab-icon">▤</span><span>项目</span></a>
      <a href="ftp.html"><span class="tab-icon">⇪</span><span>FTP</span></a>
      <a href="settings.html"><span class="tab-icon">⚙</span><span>设置</span></a>
    </nav>
  </div>

  <div class="preview-nav" id="previewNav">
    <div class="preview-nav-menu">
      <a href="index.html">首页</a>
      <a href="chat.html">对话</a>
      <a href="projects.html" class="active">项目</a>
      <a href="project-edit.html">编辑项目</a>
      <a href="ftp.html">FTP</a>
      <a href="settings.html">设置</a>
    </div>
    <button type="button" class="preview-nav-toggle" id="previewNavToggle" title="切换页面">⇅</button>
  </div>

  <script>
    (function () {
      var nav = document.getElementById('previewNav');
      var t = document.getElementById('previewNavToggle');
      if (!nav || !t) return;
      t.addEventListener('click', function () { nav.classList.toggle('is-open'); });
      document.addEventListener('click', function (e) {
        if (!nav.contains(e.target)) nav.classList.remove('is-open');
      });
    })();
  </script>
</body>
</html>
