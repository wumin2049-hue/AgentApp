<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#e8f1fc" />
  <title>mincode · 编辑项目</title>
  <link rel="stylesheet" href="assets/app.css" />
  <link rel="icon" type="image/png" href="assets/icon.png" />
</head>
<body>
  <div class="app-shell">
    <div class="preview-banner">静态预览 · 编辑项目</div>

    <header class="app-header">
      <h1>编辑项目</h1>
      <div class="sub">📁 Documents/www</div>
      <div class="sub"><a href="projects.html" class="btn-link">← 返回项目列表</a></div>
    </header>

    <main class="app-main">
      <div class="card card-premium">
        <span class="card-title">项目信息</span>
        <div class="field"><label>名称</label><input type="text" value="官网前端" /></div>
        <p class="hint-text sp-0">
          AI 模型与 Agent 地址在 <a href="settings.html">全局设置</a> 中配置，所有项目共用。
        </p>
        <div class="field sp-t3">
          <label>项目 Rules（可选）</label>
          <textarea rows="4" placeholder="写入本项目约定（编码风格、目录约束等）">使用 2 空格缩进；组件放 src/components；不要改动 public/ 下的第三方脚本。</textarea>
        </div>
      </div>

      <div class="card">
        <span class="card-title">本地目录</span>
        <p class="card-meta">📁 Documents/www · 沙盒内 128 个文件</p>
        <div class="stat-grid sp-t3 sp-b3">
          <div class="stat-cell"><span class="stat-value">128</span><span class="stat-label">已同步</span></div>
          <div class="stat-cell is-ok"><span class="stat-value">3</span><span class="stat-label">待上传</span></div>
          <div class="stat-cell is-warn"><span class="stat-value">2</span><span class="stat-label">待写回</span></div>
        </div>
        <button class="btn btn-ghost btn-block" type="button">↻ 同步到 App 沙盒</button>
        <button class="btn btn-ghost btn-block" type="button">写回修改到手机（2）</button>
        <p class="hint-text ok sp-t2">已同步 128 个文件，4 个跳过</p>
      </div>

      <div class="card">
        <span class="card-title">FTP</span>
        <div class="field"><label>主机</label><input type="text" value="ftp.example.com" /></div>
        <div class="field"><label>端口</label><input type="number" value="21" /></div>
        <div class="field"><label>用户名</label><input type="text" value="webuser" /></div>
        <div class="field"><label>密码</label><input type="password" value="password" /></div>
        <div class="field"><label>远程根目录</label><input type="text" value="/public_html" placeholder="/public_html" /></div>
        <div class="field"><label>路径前缀</label><input type="text" placeholder="本地路径映射到 FTP 的子目录" /></div>
        <label class="check-row"><input type="checkbox" checked /> 被动模式（passive）</label>
        <label class="check-row"><input type="checkbox" /> FTPS（secure）</label>
        <div class="btn-row sp-t3">
          <button class="btn btn-ghost" type="button">测试连接</button>
        </div>
        <p class="hint-text ok sp-t2">连接成功，目录内 37 项</p>
      </div>

      <a class="btn btn-primary btn-block" href="projects.html" style="text-decoration:none;text-align:center">保存并设为当前</a>
      <button class="btn btn-danger btn-block" type="button">删除项目</button>
    </main>

    <nav class="tab-bar">
      <a href="index.html"><span class="tab-icon">⌂</span><span>首页</span></a>
      <a href="chat.html"><span class="tab-icon">◉</span><span>对话</span></a>
      <a href="projects.html" class="active"><span class="tab-icon">▤</span><span>项目</span></a>
      <a href="ftp.html"><span class="tab-icon">⇪</span><span>FTP</span></a>
      <a href="settings.html"><span class="tab-icon">⚙</span><span>设置</span></a>
    </nav>
  </div>

  <div class="preview-nav" id="previewNav">
    <div class="preview-nav-menu">
      <a href="index.html">首页</a>
      <a href="chat.html">对话</a>
      <a href="projects.html">项目</a>
      <a href="project-edit.html" class="active">编辑项目</a>
      <a href="ftp.html">FTP</a>
      <a href="settings.html">设置</a>
    </div>
    <button type="button" class="preview-nav-toggle" id="previewNavToggle" title="切换页面">⇅</button>
  </div>

  <script>
    (function () {
      var nav = document.getElementById('previewNav');
      var t = document.getElementById('previewNavToggle');
      if (!nav || !t) return;
      t.addEventListener('click', function () { nav.classList.toggle('is-open'); });
      document.addEventListener('click', function (e) {
        if (!nav.contains(e.target)) nav.classList.remove('is-open');
      });
    })();
  </script>
</body>
</html>
